<!--
  github-brandkit mark template.

  Square. Solid colour ground with a Lucide glyph in white.
  viewBox 1024 so the same source rasterizes crisply to 512 and 1024.

  Tokens filled by render.ts:
    #BE123C         ground fill (hand-assigned per project)
    #FFFFFF    icon stroke (#FFFFFF by default)
    228    corner radius
    234     icon group translate X (centred)
    234     icon group translate Y (centred)
    23.167 icon group scale (iconPx / 24)
    <path d="M12 19v3" />
  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
  <rect x="9" y="2" width="6" height="13" rx="3" />     Lucide inner SVG nodes (paths/circles), stroke inherited
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="#BE123C"/>
  <g transform="translate(234 234) scale(23.167)"
     fill="none" stroke="#FFFFFF" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3" />
  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
  <rect x="9" y="2" width="6" height="13" rx="3" /></g>
</svg>
