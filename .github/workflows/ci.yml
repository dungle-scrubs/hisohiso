name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Swift quality gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run tests
        run: swift test

      - name: Build debug executable
        run: swift build

      - name: Build release executable
        run: swift build -c release

      - name: Run SwiftLint
        run: make lint
